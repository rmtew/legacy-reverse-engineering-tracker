# Fair adaptive polling: oldest probes first; changed/oldest queued scans first.
name: Refresh GitHub metadata

on:
  schedule:
    # Two NZ-local refresh windows. Both NZST/NZDT UTC variants are scheduled;
    # the first step selects the correct pair for the current Auckland offset.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "data/pending-projects.json"
      - "tools/merge_pending_projects.py"
      - "tools/refresh_github.py"
      - "tools/collect_activity.py"
      - "tools/record_project_activity.py"
      - "state/project-catalog-state.json"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write

concurrency:
  group: refresh-github-metadata
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Auckland refresh window
        id: window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset="$(TZ=Pacific/Auckland date +%z)"
          schedule='${{ github.event.schedule }}'
          case "$offset:$schedule" in
            "+1300:30 5 * * *"|"+1300:30 17 * * *"|"+1200:30 6 * * *"|"+1200:30 18 * * *")
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Selected $schedule for Auckland offset $offset."
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping DST-alternate schedule $schedule for Auckland offset $offset."
              ;;
          esac

      - name: Merge pending discoveries
        if: steps.window.outputs.run == 'true'
        run: python tools/merge_pending_projects.py

      - name: Probe repositories and schedule scans
        if: steps.window.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
        run: python tools/refresh_github.py

      - name: Collect due activity incrementally
        if: steps.window.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
        run: python tools/collect_activity.py

      - name: Record project catalogue changes
        if: steps.window.outputs.run == 'true'
        run: python tools/record_project_activity.py

      - name: Validate tracker data
        if: steps.window.outputs.run == 'true'
        run: python tools/validate_site_data.py data/projects.json data/activity.json

      - name: Commit changes
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/projects.json data/pending-projects.json data/activity.json state/github-poll-state.json state/project-catalog-state.json; then
            echo "No metadata, activity, pending-discovery or poll-state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/pending-projects.json data/activity.json state/github-poll-state.json state/project-catalog-state.json
          git commit -m "Refresh adaptive GitHub metadata and activity"
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then exit 0; fi
            else
              echo "main advanced during refresh; rerunning generators on latest main"
              git reset --hard origin/main
              python tools/merge_pending_projects.py
              python tools/refresh_github.py
              python tools/collect_activity.py
              python tools/record_project_activity.py
              python tools/validate_site_data.py data/projects.json data/activity.json
              if git diff --quiet -- data/projects.json data/pending-projects.json data/activity.json state/github-poll-state.json state/project-catalog-state.json; then
                echo "Latest main already contains equivalent generated state"
                exit 0
              fi
              git add data/projects.json data/pending-projects.json data/activity.json state/github-poll-state.json state/project-catalog-state.json
              git commit -m "Refresh adaptive GitHub metadata and activity"
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep $((attempt * 2))
          done
          exit 1
