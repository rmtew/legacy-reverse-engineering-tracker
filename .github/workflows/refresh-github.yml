name: Refresh GitHub metadata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "tools/refresh_github.py"
      - "tools/enrich_evidence.py"
      - "tools/collect_activity.py"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write

concurrency:
  group: refresh-github-metadata
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh project metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/refresh_github.py

      - name: Enrich evidence-backed fields
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/enrich_evidence.py

      - name: Collect recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/collect_activity.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/projects.json data/activity.json; then
            echo "No metadata or activity changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/activity.json
          git commit -m "Refresh GitHub metadata, evidence and activity"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Concurrent edit conflicts with refresh; refusing to overwrite it."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
