name: Refresh GitHub metadata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "tools/refresh_github.py"
      - "tools/collect_activity.py"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write

concurrency:
  group: refresh-github-metadata
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Debounce superseded pushes
        id: latest
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 10
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A newer main-branch commit exists; skipping this superseded run."
          fi

      - name: Probe repositories and schedule scans
        if: steps.latest.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RATE_RESERVE: "250"
          GITHUB_PROBE_REQUEST_BUDGET: "250"
        run: python tools/refresh_github.py

      - name: Collect due activity incrementally
        if: steps.latest.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RATE_RESERVE: "250"
          GITHUB_ACTIVITY_REQUEST_BUDGET: "450"
        run: python tools/collect_activity.py

      - name: Commit changes
        if: steps.latest.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/projects.json data/activity.json state/github-poll-state.json; then
            echo "No metadata, activity or poll-state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/activity.json state/github-poll-state.json
          git commit -m "Refresh adaptive GitHub metadata and activity"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
