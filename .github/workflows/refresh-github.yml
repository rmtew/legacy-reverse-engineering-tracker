# Fair adaptive polling: oldest probes first; changed/oldest queued scans first.
name: Refresh GitHub metadata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "tools/refresh_github.py"
      - "tools/collect_activity.py"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write

concurrency:
  group: refresh-github-metadata
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Probe repositories and schedule scans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
        run: python tools/refresh_github.py

      - name: Collect due activity incrementally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
        run: python tools/collect_activity.py

      - name: Validate tracker data
        run: python tools/validate_site_data.py data/projects.json data/activity.json

      - name: Commit changes
        run: |
          if git diff --quiet -- data/projects.json data/activity.json state/github-poll-state.json; then
            echo "No metadata, activity or poll-state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/activity.json state/github-poll-state.json
          git commit -m "Refresh adaptive GitHub metadata and activity"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
