# Fair adaptive polling: oldest due probes first; changed/oldest queued scans first.
# Discovery landings explicitly dispatch this workflow because GITHUB_TOKEN ref updates do not emit downstream push workflows.
# workflow_dispatch is allowed from github-actions[bot]; bot-authored pushes remain blocked to prevent recursion.
name: Refresh GitHub metadata

on:
  schedule:
    # Fifteen-minute probe slots, away from the top of each hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      full_probe:
        description: Probe every tracked repository in this run
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "data/pending-projects.json"
      - "tools/merge_pending_projects.py"
      - "tools/refresh_github.py"
      - "tools/collect_activity.py"
      - "tools/activity_history.py"
      - "tools/record_project_activity.py"
      - "state/project-catalog-state.json"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-github-metadata
  # Keep queued runs and discovery dispatches; never cancel a running refresh.
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select refresh window
        id: window
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Merge pending discoveries
        if: steps.window.outputs.run == 'true'
        run: python tools/merge_pending_projects.py

      - name: Probe repositories and schedule scans
        if: steps.window.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
          GITHUB_FORCE_FULL_PROBE: ${{ inputs.full_probe || false }}
        run: python tools/refresh_github.py

      - name: Collect due activity incrementally
        if: steps.window.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MIN_RATE_RESERVE: "100"
          GITHUB_MAX_RATE_RESERVE: "250"
          GITHUB_RATE_RESERVE_FRACTION: "0.15"
          GITHUB_HTTP_SAFETY_CAP: "4000"
          GITHUB_REQUEST_DELAY: "0.10"
        run: python tools/collect_activity.py

      - name: Record project catalogue changes
        if: steps.window.outputs.run == 'true'
        run: python tools/record_project_activity.py

      - name: Validate tracker data
        if: steps.window.outputs.run == 'true'
        run: python tools/validate_site_data.py data/projects.json data/activity.json

      - name: Commit changes
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/projects.json data/pending-projects.json data/project-audits.json data/activity.json state/github-poll-state.json state/project-catalog-state.json; then
            echo "No metadata, activity, pending-discovery or poll-state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/pending-projects.json data/project-audits.json data/activity.json state/github-poll-state.json state/project-catalog-state.json
          git commit -m "Refresh adaptive GitHub metadata and activity"
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then exit 0; fi
            else
              echo "main advanced during refresh; rerunning generators on latest main"
              git reset --hard origin/main
              python tools/merge_pending_projects.py
              python tools/refresh_github.py
              python tools/collect_activity.py
              python tools/record_project_activity.py
              python tools/validate_site_data.py data/projects.json data/activity.json
              if git diff --quiet -- data/projects.json data/pending-projects.json data/project-audits.json data/activity.json state/github-poll-state.json state/project-catalog-state.json; then
                echo "Latest main already contains equivalent generated state"
                exit 0
              fi
              git add data/projects.json data/pending-projects.json data/project-audits.json data/activity.json state/github-poll-state.json state/project-catalog-state.json
              git commit -m "Refresh adaptive GitHub metadata and activity"
              if git push origin HEAD:main; then exit 0; fi
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Dispatch Pages after discovery refresh
        if: steps.window.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
