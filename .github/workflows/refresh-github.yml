# Repository work is collected once; publication retries are offline.
name: Refresh GitHub metadata

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full_probe:
        description: Start or resume a full repository sweep
        type: boolean
        default: false
      repositories:
        description: Maximum distinct repositories per batch (1-500)
        type: string
        default: "500"
      seconds:
        description: Collection budget (1-900 seconds; publication has separate headroom)
        type: string
        default: "600"
      requests:
        description: Shared HTTP budget across probes and activity (0-2000)
        type: string
        default: "1000"
      continuation:
        description: Internal work-cycle token; leave empty for manual Resume
        type: string
        default: ""
      request_id:
        description: Internal original request identity
        type: string
        default: ""
      resume_run_id:
        description: Internal publication recovery artifact
        type: string
        default: ""
      recovery_attempt:
        description: Internal bounded recovery attempt
        type: string
        default: "0"
      publication_base:
        description: Retained compatibility input for discovery landings
        type: string
        default: ""
      publication_head:
        description: Retained compatibility input for discovery landings
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "data/projects.index.json"
      - "data/projects/**"
      - "data/pending-projects.json"
      - "tools/catalogue_storage.py"
      - "tools/merge_pending_projects.py"
      - "tools/refresh_github.py"
      - "tools/refresh_pipeline.py"
      - "tools/collection_budget.py"
      - "tools/collect_activity.py"
      - "tools/refresh_scope.py"
      - "tools/activity_history.py"
      - "tools/record_project_activity.py"
      - ".github/workflows/refresh-github.yml"

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: refresh-github-metadata
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      continue: ${{ steps.publish.outputs.continue }}
      continuation: ${{ steps.publish.outputs.continuation }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REFRESH_REPOSITORIES: ${{ inputs.repositories || '500' }}
      REFRESH_SECONDS: ${{ inputs.seconds || '600' }}
      REFRESH_REQUESTS: ${{ inputs.requests || '1000' }}
      REFRESH_CONTINUATION: ${{ inputs.continuation || '' }}
      REFRESH_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
      REFRESH_FULL: ${{ inputs.full_probe || false }}
      REFRESH_RESUME: ${{ inputs.resume_run_id || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Collect bounded repository work or recover a publication bundle
        run: |
          set -euo pipefail
          if [ -n "$REFRESH_RESUME" ]; then
            [[ "$REFRESH_RESUME" =~ ^[0-9]+$ ]]
            gh run download "$REFRESH_RESUME" --name refresh-bundle --dir "$RUNNER_TEMP/refresh-recovery"
            cp "$RUNNER_TEMP/refresh-recovery/refresh-bundle.json" "$RUNNER_TEMP/refresh-bundle.json"
          else
            full=()
            if [ "$REFRESH_FULL" = "true" ]; then full=(--full); fi
            python -u tools/refresh_pipeline.py collect --bundle "$RUNNER_TEMP/refresh-bundle.json" \
              --repositories "$REFRESH_REPOSITORIES" --seconds "$REFRESH_SECONDS" --requests "$REFRESH_REQUESTS" \
              --request-id "$REFRESH_REQUEST_ID" --continuation "$REFRESH_CONTINUATION" "${full[@]}"
          fi

      - name: Preserve collected results for interrupted publication
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-bundle
          path: ${{ runner.temp }}/refresh-bundle.json
          if-no-files-found: warn
          retention-days: 2

      - name: Publish results and refresh progress atomically
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Reuses the collected bundle. Never re-run network collection here.
            python -u tools/refresh_pipeline.py apply --bundle "$RUNNER_TEMP/refresh-bundle.json"
            git add -A -- data/projects.index.json data/projects/ data/project-audits.index.json data/project-audits/ data/pending-projects.json data/activity.json state/github-poll-state.json state/project-catalog-state.json state/refresh-progress.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh bounded repository batch and save progress"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Request publication of new complete public content
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/pages_publication.py request

  continue:
    needs: refresh
    if: always() && github.ref == 'refs/heads/main' && (needs.refresh.result == 'success' || needs.refresh.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CONTINUE: ${{ needs.refresh.outputs.continue }}
      CONTINUATION: ${{ needs.refresh.outputs.continuation }}
      RESULT: ${{ needs.refresh.result }}
      ARTIFACT: ${{ needs.refresh.outputs.artifact }}
      REQUEST_ID: ${{ inputs.request_id || github.run_id }}
      RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
      FULL: ${{ inputs.full_probe || false }}
      REPOSITORIES: ${{ inputs.repositories || '500' }}
      SECONDS_BUDGET: ${{ inputs.seconds || '600' }}
      REQUESTS_BUDGET: ${{ inputs.requests || '1000' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Handoff the next batch after a published checkpoint
        run: |
          set -euo pipefail
          args=(--ref main -f "request_id=$REQUEST_ID" -f "repositories=$REPOSITORIES" -f "seconds=$SECONDS_BUDGET" -f "requests=$REQUESTS_BUDGET")
          if [ "$RESULT" = "success" ]; then
            if [ "$CONTINUE" != "true" ]; then exit 0; fi
            args+=(-f "continuation=$CONTINUATION")
          else
            [[ "$RECOVERY_ATTEMPT" =~ ^[0-2]$ ]]
            if [ "$RECOVERY_ATTEMPT" -ge 2 ]; then
              echo "Recovery limit reached. Durable work remains available for manual Resume or the next scheduled run."
              exit 1
            fi
            args+=(-f "recovery_attempt=$((RECOVERY_ATTEMPT + 1))" -f "full_probe=$FULL")
            if [ -n "$ARTIFACT" ]; then args+=(-f "resume_run_id=${{ github.run_id }}"); fi
          fi
          # Explicit workflow_dispatch is supported for GITHUB_TOKEN; bot pushes
          # alone do not trigger subsequent runs. Duplicate tokens collect no work.
          for attempt in 1 2 3; do
            if gh workflow run refresh-github.yml "${args[@]}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Handoff failed. Published progress is safe; use manual Resume."
          exit 1
