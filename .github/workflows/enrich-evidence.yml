name: Enrich project evidence

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/enrich_evidence.py"
      - ".github/workflows/enrich-evidence.yml"

permissions:
  contents: write

concurrency:
  group: enrich-project-evidence
  cancel-in-progress: true

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Debounce superseded pushes
        id: latest
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 10
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A newer main-branch commit exists; skipping this superseded run."
          fi

      - name: Enrich evidence-backed fields
        if: steps.latest.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/enrich_evidence.py

      - name: Commit changes
        if: steps.latest.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No evidence changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Enrich project evidence"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
