name: Enrich project evidence

on:
  schedule:
    # Small rotating slices; never scan the entire catalogue in one job.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      records:
        description: Optional total project cap; 0 uses separate work limits
        type: string
        default: "0"
      doc_records:
        description: Document work cap (0-256); requests/time remain global
        type: string
        default: "64"
      ci_records:
        description: Cheap CI work cap (0-256); independent of documents
        type: string
        default: "60"
      api_requests:
        description: GitHub API ceiling within the HTTP budget (0-200)
        type: string
        default: "80"
      requests:
        description: HTTP request budget (0-1000)
        type: string
        default: "300"
      seconds:
        description: Collection wall-time budget (1-600 seconds)
        type: string
        default: "600"
  push:
    branches: [main]
    paths:
      - "tools/enrich_evidence.py"
      - "tools/enrichment_pipeline.py"
      - ".github/workflows/enrich-evidence.yml"

permissions:
  contents: write

concurrency:
  group: enrich-project-evidence
  cancel-in-progress: false

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect one bounded evidence slice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENRICH_RECORDS: ${{ inputs.records || '0' }}
          ENRICH_DOC_RECORDS: ${{ inputs.doc_records || '64' }}
          ENRICH_CI_RECORDS: ${{ inputs.ci_records || '60' }}
          ENRICH_API_REQUESTS: ${{ inputs.api_requests || '80' }}
          ENRICH_REQUESTS: ${{ inputs.requests || '300' }}
          ENRICH_SECONDS: ${{ inputs.seconds || '600' }}
        run: >-
          python -u tools/enrich_evidence.py collect
          --bundle "$RUNNER_TEMP/enrichment-bundle.json"
          --records "$ENRICH_RECORDS" --doc-records "$ENRICH_DOC_RECORDS" --ci-records "$ENRICH_CI_RECORDS"
          --requests "$ENRICH_REQUESTS" --api-requests "$ENRICH_API_REQUESTS" --seconds "$ENRICH_SECONDS"

      - name: Publish completed results and progress together
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The bundle survives checkout resets. This loop performs offline replay
          # only: stale or concurrently edited records remain due for another slice.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            set +e
            python -u tools/enrich_evidence.py apply --bundle "$RUNNER_TEMP/enrichment-bundle.json"
            replay_status=$?
            set -e
            if [ "$replay_status" -eq 75 ]; then
              sleep 10
              continue
            fi
            if [ "$replay_status" -ne 0 ]; then exit "$replay_status"; fi
            git add -A -- data/projects.index.json data/projects/ data/activity.json state/project-catalog-state.json state/enrichment-state.json
            if git diff --cached --quiet; then
              echo "No unpublished enrichment results or progress remain"
              exit 0
            fi
            git commit -m "Enrich bounded evidence slice and save progress"
            # Fast-forward push rejects concurrent main updates; no force push.
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
