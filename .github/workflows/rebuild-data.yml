name: Rebuild project data
on:
  push:
    branches: [main]
    paths:
      - "projects/**/*.yml"
      - "tools/build_data.py"
      - ".github/workflows/rebuild-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build browser data
        run: python tools/build_data.py
      - name: Commit generated data
        run: |
          if git diff --quiet -- web/projects.json; then
            echo "projects.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/projects.json
          git commit -m "Rebuild browser project data"
          git push
