name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully merged non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"

          gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [ "${branch}" = "main" ] && continue

            encoded="${branch//\//%2F}"
            head_sha="$(gh api "repos/${REPO}/git/ref/heads/${encoded}" --jq '.object.sha')"
            compare="$(gh api "repos/${REPO}/compare/${head_sha}...${main_sha}")"
            ahead_by="$(jq -r '.ahead_by' <<<"${compare}")"
            merge_base="$(jq -r '.merge_base_commit.sha' <<<"${compare}")"

            if [ "${merge_base}" = "${head_sha}" ] && [ "${ahead_by}" != "0" ] || [ "${head_sha}" = "${main_sha}" ]; then
              echo "Deleting fully merged branch: ${branch}"
              gh api --method DELETE "repos/${REPO}/git/refs/heads/${encoded}"
            else
              echo "Keeping branch with unique/divergent work: ${branch}"
            fi
          done
