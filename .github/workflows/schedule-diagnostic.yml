name: Schedule delivery diagnostic

on:
  schedule:
    - cron: '17,22,27,32 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/schedule-diagnostic.yml']

permissions:
  contents: read
  actions: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduling receipt
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Expected cron: ${{ github.event.schedule }}"
          date -u
      - name: Record refresh workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/workflows/refresh-github.yml --jq '{id, name, state, path, updated_at}'
