name: Land discovery automation

on:
  push:
    branches:
      - 'automation/discovery-*'

permissions:
  contents: write
  actions: write

concurrency:
  group: land-discovery-automation
  cancel-in-progress: false

jobs:
  fast-forward-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout discovery branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply validated discovery payload
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python tools/apply_discovery_batch.py .github/discovery-batch.json --write
          # Only the compact payload travels through the connector. Restore the
          # established workflow before the complete catalogue reaches main.
          git restore --source=origin/main -- .github/workflows/land-discovery.yml
          git rm .github/discovery-batch.json
          git add data/projects.json data/project-audits.json data/discovery-sources.json data/discovery-decisions.json data/research-activity.json .github/workflows/land-discovery.yml
          git commit -m "Discover 30 further platform projects with validated evidence"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate discovery branch state
        run: python tools/validate_site_data.py data/projects.json data/activity.json

      - name: Check discovery batch integrity
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          node tools/test_cpu_filters.js
          git diff --check

      - name: Publish validated generated commit to discovery branch
        shell: bash
        run: git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Verify branch is a clean fast-forward of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${REPO}/compare/${main_sha}...${HEAD_SHA}")"

          status="$(jq -r '.status' <<<"${compare}")"
          merge_base="$(jq -r '.merge_base_commit.sha' <<<"${compare}")"
          ahead_by="$(jq -r '.ahead_by' <<<"${compare}")"
          behind_by="$(jq -r '.behind_by' <<<"${compare}")"

          echo "main=${main_sha}"
          echo "head=${HEAD_SHA}"
          echo "status=${status} ahead=${ahead_by} behind=${behind_by}"

          if [[ "${merge_base}" != "${main_sha}" || "${behind_by}" != "0" || "${ahead_by}" == "0" ]]; then
            echo "Refusing to update main: automation branch is not a non-empty clean fast-forward."
            exit 1
          fi

      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPO}/git/refs/heads/main" \
            -f sha="${HEAD_SHA}" \
            -F force=false

      - name: Dispatch metadata refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-github.yml --ref main

      - name: Delete landed discovery branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${REPO}/git/refs/heads/${TRIGGER_BRANCH}"
