name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - "data/activity.json"
      - "data/discovery-sources.json"
      - "data/discovery-decisions.json"
      - "data/project-audits.json"
      - "data/research-activity.json"
      - "tools/generate_rss.py"
      - "tools/generate_recent_activity.py"
      - "tools/activity_history.py"
      - "tools/test_recent_activity.py"
      - "tools/test_activity_history.py"
      - "tools/test_rss.py"
      - "tools/test_refresh_github.py"
      - "tools/validate_site_data.py"
      - "tools/apply_discovery_batch.py"
      - "tools/test_discovery_batch.py"
      - "tools/test_cpu_filters.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh GitHub metadata", "Enrich project evidence"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Checkout history for push inspection
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to deploy now
        id: decision
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # State and refresh timestamps change even without new public data.
            # Compare material data with the commit that started the workflow.
            base='${{ github.event.workflow_run.head_sha }}'
            if ! git cat-file -e "$base^{commit}"; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A chat-driven catalogue push is intentionally held until the
            # refresh finishes. Include that original push even if the new
            # adaptive cadence does not change its records again.
            if [ '${{ github.event.workflow_run.event }}' = 'push' ] &&
               git rev-parse "$base^" >/dev/null 2>&1 &&
               git diff --name-only "$base^" "$base" -- data/projects.json | grep -Fxq 'data/projects.json'; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python - "$base" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          import sys

          base = sys.argv[1]
          paths = ('data/projects.json', 'data/activity.json', 'data/project-audits.json')

          def material(revision, path):
              try:
                  raw = subprocess.check_output(['git', 'show', f'{revision}:{path}'])
              except subprocess.CalledProcessError:
                  return None
              value = json.loads(raw)
              if path == 'data/projects.json':
                  for project in value:
                      (project.get('github') or {}).pop('checked_at', None)
              elif path == 'data/activity.json':
                  value.pop('generated_at', None)
              return value

          changed = any(material(base, path) != material('HEAD', path) for path in paths)
          print('deploy=' + str(changed).lower())
          PY
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before='${{ github.event.before }}'
          after='${{ github.sha }}'

          # A catalogue change starts Refresh GitHub metadata. Do not publish the
          # pre-refresh snapshot; its successful workflow_run will deploy main.
          if git diff --name-only "$before" "$after" | grep -Fxq 'data/projects.json'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Catalogue changed; deferring Pages deployment until metadata refresh completes."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: node --check web/tracker.js

      - name: Check CPU filter behavior
        run: node --test tools/test_cpu_filters.js

      - name: Check RSS generator syntax
        run: python -m py_compile tools/generate_rss.py tools/generate_recent_activity.py tools/validate_site_data.py tools/apply_discovery_batch.py

      - name: Check discovery batch integrity
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R web _site/
          cp -R data _site/
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          for asset in ('tracker.css', 'tracker.js'):
              path = 'web/' + asset
              digest = sha256((Path('_site') / path).read_bytes()).hexdigest()[:12]
              html, count = re.subn(re.escape(path) + r'(?:\?v=[^"\s]*)?', path + '?v=' + digest, html)
              if count != 1:
                  raise ValueError(f'Expected one reference to {path}, found {count}')
          index.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Generate activity RSS
        run: python tools/generate_rss.py data/activity.json data/projects.json _site/activity.xml

      - name: Generate recent activity feed
        run: |
          python tools/generate_recent_activity.py data/activity.json _site/data/activity-30d.json
          python tools/generate_recent_activity.py data/activity.json _site/data/activity-180d.json --days 180

      - name: Validate generated site data
        run: python tools/validate_site_data.py data/projects.json data/activity.json _site/activity.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
