name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Debounce superseded pushes
        id: latest
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 10
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A newer main-branch commit exists; skipping this superseded run."
          fi

      - name: Check JavaScript syntax
        if: steps.latest.outputs.run == 'true'
        run: node --check web/tracker.js

      - name: Prepare static site
        if: steps.latest.outputs.run == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R web _site/
          cp -R data _site/
          touch _site/.nojekyll

      - name: Configure Pages
        if: steps.latest.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.latest.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
