name: Deploy GitHub Pages
run-name: Publish latest complete site (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - "data/activity.json"
      - "data/discovery-sources.json"
      - "data/discovery-decisions.json"
      - "data/discovery-decisions.index.json"
      - "data/discovery-decisions/**"
      - "data/project-audits.json"
      - "data/project-audits.index.json"
      - "data/project-audits/**"
      - "data/projects.json"
      - "data/projects.index.json"
      - "data/projects/**"
      - "data/research-activity.json"
      - "tools/build_site.py"
      - "tools/generate_rss.py"
      - "tools/generate_recent_activity.py"
      - "tools/activity_history.py"
      - "tools/catalogue_storage.py"
      - "tools/execution_architecture.py"
  workflow_dispatch:
    inputs:
      attempt:
        description: Internal bounded deployment recovery attempt
        type: string
        default: "0"
  schedule:
    # Recover a missed request/failed deployment without a writable request copy.
    - cron: "29 * * * *"

permissions:
  contents: read
  actions: write
  deployments: read
  pages: write
  id-token: write

# Admission, build, deployment and reconciliation share the same lock. Replaced
# pending wake-ups are safe: every admitted request inspects latest main.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      snapshot: ${{ steps.decision.outputs.snapshot }}
      fingerprint: ${{ steps.decision.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Admit only new complete public content
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/pages_publication.py gate

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.snapshot }}
          fetch-depth: 0
      - name: Verify the exact admitted publication snapshot
        env:
          SNAPSHOT: ${{ needs.gate.outputs.snapshot }}
        run: python tools/pages_publication.py verify --snapshot "$SNAPSHOT"
      - name: Build and validate the pinned site
        run: python tools/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  reconcile:
    needs: [gate, deploy]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve follow-up changes and bounded failure recovery
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          FAILED_DIGEST: ${{ needs.gate.outputs.fingerprint }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
        run: |
          failure=()
          if [ "$DEPLOY_RESULT" = "failure" ] || [ "$GATE_RESULT" = "failure" ]; then failure=(--failure); fi
          python tools/pages_publication.py request --attempt "$ATTEMPT" \
            --failed-digest "$FAILED_DIGEST" "${failure[@]}"
