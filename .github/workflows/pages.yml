name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - "data/activity.json"
      - "data/discovery-sources.json"
      - "data/project-audits.json"
      - "data/research-activity.json"
      - "tools/generate_rss.py"
      - "tools/validate_site_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh GitHub metadata", "Enrich project evidence"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Checkout history for push inspection
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to deploy now
        id: decision
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before='${{ github.event.before }}'
          after='${{ github.sha }}'

          # A catalogue change starts Refresh GitHub metadata. Do not publish the
          # pre-refresh snapshot; its successful workflow_run will deploy main.
          if git diff --name-only "$before" "$after" | grep -Fxq 'data/projects.json'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Catalogue changed; deferring Pages deployment until metadata refresh completes."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: node --check web/tracker.js

      - name: Check RSS generator syntax
        run: python -m py_compile tools/generate_rss.py tools/validate_site_data.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R web _site/
          cp -R data _site/
          touch _site/.nojekyll

      - name: Generate activity RSS
        run: python tools/generate_rss.py data/activity.json data/projects.json _site/activity.xml

      - name: Validate generated site data
        run: python tools/validate_site_data.py data/projects.json data/activity.json _site/activity.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
